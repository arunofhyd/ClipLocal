<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: top-bright-blue to bottom-deep-blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8CFF"/>
      <stop offset="100%" stop-color="#0066F2"/>
    </linearGradient>

    <!-- Corner shine: bright at top-left and bottom-right, transparent in centre -->
    <!-- In SVG, x1="0" y1="0" → top-left, x2="1" y2="1" → bottom-right -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Clip path matching the inner rounded rect stroke so shine only paints the border ring -->
    <clipPath id="shineClip">
      <rect x="34" y="34" width="444" height="444" rx="98" fill="none"/>
    </clipPath>
  </defs>

  <!-- macOS Squircle background (margin 32px for native macOS icon scaling) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>

  <!-- Corner shine painted only along the border ring via a thick stroked rect -->
  <rect x="34" y="34" width="444" height="444" rx="98"
        fill="none"
        stroke="url(#shine)"
        stroke-width="8"/>

  <!-- Outer circle -->
  <circle cx="256" cy="256" r="160"
          fill="none"
          stroke="#ffffff"
          stroke-width="15"/>

  <!-- Paperclip rotated 45° -->
  <g transform="translate(256,256) rotate(45) scale(2.6) translate(-60,-60)">
    <path d="M54 50 v20 a 6 6 0 0 0 12 0 v-28 a 10 10 0 0 0 -20 0 v32 a 14 14 0 0 0 28 0 v-28"
          fill="none"
          stroke="#ffffff"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
