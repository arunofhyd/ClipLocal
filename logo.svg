<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8CFF"/>
      <stop offset="100%" stop-color="#0066F2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0033aa" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- macOS Squircle Canvas Base (Margin 32px for native macOS icon scaling) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="url(#shine)" stroke-width="6"/>

  <!-- Paperclip Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="15" filter="url(#shadow)"/>
  <g transform="translate(256,256) rotate(45) scale(2.6) translate(-60,-60)">
    <path d="M54 50 v20 a 6 6 0 0 0 12 0 v-28 a 10 10 0 0 0 -20 0 v32 a 14 14 0 0 0 28 0 v-28"
          fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
